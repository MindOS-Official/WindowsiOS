name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ipa:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew update
          brew install xcodegen meson ninja pkg-config python@3.12

      - name: Build iOS static dependencies (libffi, glib, libslirp)
        run: |
          chmod +x scripts/build_ios_deps.sh
          ./scripts/build_ios_deps.sh

      - name: Build libwinvm.a
        run: |
          make -j$(sysctl -n hw.ncpu) ios-lib

      - name: Generate Xcode project
        run: |
          xcodegen generate --spec ios/project.yml

      - name: Archive unsigned iOS app
        run: |
          xcodebuild \
            -project ios/WindowsiOS.xcodeproj \
            -scheme WindowsiOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/WindowsiOS.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/WindowsiOS.xcarchive/Products/Applications/WindowsiOS.app build/ipa/Payload/
          cd build/ipa
          zip -r -y ../WindowsiOS-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowsiOS-unsigned-ipa
          path: build/WindowsiOS-unsigned.ipa
          retention-days: 14
